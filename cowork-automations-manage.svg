<svg xmlns="http://www.w3.org/2000/svg" width="380" height="258" viewBox="0 0 380 258" role="img" aria-labelledby="title desc">
  <title id="title">Cowork Automations panel confirming the Chief of Staff Brief schedule</title>
  <desc id="desc">The Cowork Automations Manage tab showing the Chief of Staff Brief listed as a recurring weekday task at 06:30.</desc>

  <rect width="380" height="258" fill="#fff"/>

  <text x="24" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1a1a1a">Automations</text>

  <rect x="24" y="66" width="74" height="30" rx="8" fill="#1f1f23"/>
  <text x="61" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">Manage</text>
  <text x="128" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#5a5a63">Runs</text>

  <rect x="24" y="114" width="332" height="120" rx="12" fill="#fff" stroke="#dedee3"/>

  <text x="44" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#34343a">Chief of Staff Brief</text>

  <rect x="44" y="165" width="292" height="50" rx="8" fill="#f2f2f4"/>
  <g transform="translate(58 182)"><path d="M3.6 6.2A5 5 0 0 1 12.4 5.2M12.4 5.2l-2.6.4M12.4 5.2l-.5-2.6M12.4 9.8A5 5 0 0 1 3.6 10.8M3.6 10.8l2.6-.4M3.6 10.8l.5 2.6" fill="none" stroke="#6b6b72" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="86" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b6b72">Every week on Monday, Tuesday, Wednesday,</text>
  <text x="86" y="201" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b6b72">Thursday, Friday at 06:30</text>
</svg>
