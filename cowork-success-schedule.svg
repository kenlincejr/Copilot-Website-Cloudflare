<svg xmlns="http://www.w3.org/2000/svg" width="340" height="838" viewBox="0 0 340 838" role="img" aria-labelledby="title desc">
  <title id="title">Cowork Workspace panel showing the Chief of Staff Brief scheduled task</title>
  <desc id="desc">The Cowork Workspace panel after setup: three completed steps, the scheduled task with its weekday recurrence, two always-allowed Send email permissions, saved output files, the update-config skill, and the connected Microsoft 365 tools.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <g id="mailicon">
      <rect width="17" height="17" rx="3" fill="#0f6cbd"/>
      <rect x="3.5" y="5" width="10" height="7.5" rx="1" fill="none" stroke="#fff" stroke-width="1.2"/>
      <path d="M3.5 5.8l5 3.6 5-3.6" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
    <g id="htmlicon">
      <rect width="15" height="15" rx="2.5" fill="#eef1f4" stroke="#c9ced6" stroke-width="1"/>
      <path d="M5.4 5.4L3.4 7.5l2 2.1M9.6 5.4l2 2.1-2 2.1" fill="none" stroke="#5a5a63" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="mdicon">
      <path d="M2 .8h7.5L13 4.3V14a1.2 1.2 0 0 1-1.2 1.2H2A1.2 1.2 0 0 1 .8 14V2A1.2 1.2 0 0 1 2 .8Z" fill="#eef1f4" stroke="#c9ced6" stroke-width="1"/>
      <path d="M9.4 1v3.4h3.4M3.6 11.6V7l2 2.4L7.6 7v4.6" fill="none" stroke="#5a5a63" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="chev"><path d="M0 0l5 5 5-5" fill="none" stroke="#6b6b72" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="close"><path d="M0 0l10 10M10 0L0 10" stroke="#3f3f46" stroke-width="1.3" stroke-linecap="round"/></g>
    <g id="tick">
      <circle r="8" fill="#fff" stroke="#a1a1a8" stroke-width="1.1"/>
      <path d="M-3.4 0l2.4 2.5 5-5" fill="none" stroke="#6d6d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="340" height="838" fill="#fff"/>
  <rect x="10" y="10" width="320" height="818" rx="14" fill="#fff" stroke="#dedee3" filter="url(#shadow)"/>

  <!-- header -->
  <text x="28" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#303036">Workspace</text>
  <use href="#close" x="296" y="29"/>
  <line x1="10" y1="58" x2="330" y2="58" stroke="#ececef"/>

  <!-- STEPS -->
  <text x="28" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#333">Steps</text>
  <rect x="248" y="76" width="42" height="20" rx="10" fill="#f2f2f3" stroke="#dedee3"/>
  <text x="269" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b6b72" text-anchor="middle">3 / 3</text>
  <use href="#chev" x="302" y="81"/>

  <line x1="38" y1="120" x2="38" y2="168" stroke="#e1e1e5" stroke-width="1.2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6d6d75">
    <use href="#tick" x="38" y="112"/><text x="58" y="117">Sync live scheduled task</text>
    <use href="#tick" x="38" y="144"/><text x="58" y="149">Collect fresh signals for today</text>
    <use href="#tick" x="38" y="176"/><text x="58" y="181">Compose &amp; deliver full brief</text>
  </g>
  <line x1="28" y1="206" x2="312" y2="206" stroke="#ececef"/>

  <!-- SCHEDULED TASK -->
  <text x="28" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#333">Scheduled task</text>
  <use href="#chev" x="302" y="227"/>

  <rect x="28" y="253" width="36" height="30" rx="6" fill="#f2f2f4"/>
  <g transform="translate(38 260)"><path d="M3.6 6.2A5 5 0 0 1 12.4 5.2M12.4 5.2l-2.6.4M12.4 5.2l-.5-2.6M12.4 9.8A5 5 0 0 1 3.6 10.8M3.6 10.8l2.6-.4M3.6 10.8l.5 2.6" fill="none" stroke="#6b6b72" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="76" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#34343a">Chief of Staff Brief</text>
  <text x="76" y="283" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#6b6b72">Every week on Monday, Tuesday, Wednes…</text>
  <g fill="#27272a"><circle cx="298" cy="268" r="1.5"/><circle cx="304" cy="268" r="1.5"/><circle cx="310" cy="268" r="1.5"/></g>
  <line x1="28" y1="304" x2="312" y2="304" stroke="#ececef"/>

  <!-- ALWAYS ALLOWED -->
  <text x="28" y="333" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#333">Always allowed</text>
  <rect x="264" y="320" width="26" height="20" rx="10" fill="#f2f2f3" stroke="#dedee3"/>
  <text x="277" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b6b72" text-anchor="middle">2</text>
  <use href="#chev" x="302" y="325"/>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#34343a">
    <use href="#mailicon" x="30" y="352"/>
    <text x="58" y="365" font-size="13.5">Send email</text>
    <use href="#close" x="300" y="356"/>
    <line x1="28" y1="384" x2="312" y2="384" stroke="#f0f0f2"/>

    <use href="#mailicon" x="30" y="400"/>
    <text x="58" y="408" font-size="13.5">Send email</text>
    <text x="58" y="424" font-size="11.5" fill="#6b6b72">Only to Ken.Lince@tdsynnex.com</text>
    <use href="#close" x="300" y="404"/>
  </g>
  <line x1="28" y1="444" x2="312" y2="444" stroke="#ececef"/>

  <!-- OUTPUT -->
  <text x="28" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#333">Output</text>
  <path d="M274 462h6l2 3h9v11h-17Z" fill="none" stroke="#6b6b72" stroke-width="1.2" stroke-linejoin="round"/>
  <use href="#chev" x="302" y="465"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4a4a50">
    <use href="#htmlicon" x="32" y="492"/><text x="58" y="504">chief-of-staff-brief-20…-26.html</text>
    <use href="#mdicon"   x="32" y="522"/><text x="58" y="534">chief-of-staff-maste…rompt.md</text>
    <use href="#htmlicon" x="32" y="552"/><text x="58" y="564">chief-of-staff-brief-20…-29.html</text>
    <use href="#htmlicon" x="32" y="582"/><text x="58" y="594">chief-of-staff-brief-20…-04.html</text>
  </g>
  <line x1="28" y1="618" x2="312" y2="618" stroke="#ececef"/>

  <!-- SKILLS &amp; PLUGINS -->
  <text x="28" y="647" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#333">Skills &amp; Plugins</text>
  <use href="#chev" x="302" y="639"/>
  <rect x="28" y="663" width="124" height="28" rx="14" fill="#fff" stroke="#dedee3"/>
  <use href="#mdicon" x="42" y="669"/>
  <text x="64" y="682" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#34343a">update-config</text>
  <line x1="28" y1="712" x2="312" y2="712" stroke="#ececef"/>

  <!-- TOOLS -->
  <text x="28" y="741" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#333">Tools</text>
  <use href="#chev" x="302" y="733"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#34343a">
    <rect x="28" y="755" width="80" height="26" rx="13" fill="#fff" stroke="#dedee3"/><text x="68" y="772" text-anchor="middle">Calendar</text>
    <rect x="114" y="755" width="76" height="26" rx="13" fill="#fff" stroke="#dedee3"/><text x="152" y="772" text-anchor="middle">Outlook</text>
    <rect x="196" y="755" width="68" height="26" rx="13" fill="#fff" stroke="#dedee3"/><text x="230" y="772" text-anchor="middle">People</text>
    <rect x="28" y="789" width="70" height="26" rx="13" fill="#fff" stroke="#dedee3"/><text x="63" y="806" text-anchor="middle">Teams</text>
    <rect x="104" y="789" width="80" height="26" rx="13" fill="#fff" stroke="#dedee3"/><text x="144" y="806" text-anchor="middle">Work IQ</text>
  </g>
</svg>
