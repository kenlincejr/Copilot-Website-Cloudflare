  <rect x="16" y="140" width="268" height="38" rx="8" fill="#f3ede4"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a">
    <path d="M34 155a6 6 0 0 1 6-6h1l2-2 2 2h1a6 6 0 0 1 6 6v2a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2z" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
    <circle cx="43" cy="164" r="1.4" fill="#1a1a1a"/>
    <text x="56" y="164">Automations</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#5a5a63">
