<svg xmlns="http://www.w3.org/2000/svg" width="300" height="230" viewBox="0 0 300 230" role="img" aria-labelledby="title desc">
  <title id="title">Cowork sidebar with Automations selected</title>
  <desc id="desc">The Copilot Cowork left sidebar showing Chat and Cowork tabs, New task, My tasks, Automations highlighted, and Customize.</desc>

  <rect width="300" height="230" fill="#fff"/>

  <rect x="16" y="16" width="268" height="34" rx="17" fill="#f2f2f4"/>
  <rect x="18" y="18" width="128" height="30" rx="15" fill="#fff"/>
  <text x="60" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#5a5a63" text-anchor="middle">Chat</text>
  <text x="212" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Cowork</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#c9791b">
    <circle cx="34" cy="82" r="8.5" fill="none" stroke="#c9791b" stroke-width="1.4"/>
    <path d="M34 78v8M30 82h8" stroke="#c9791b" stroke-width="1.4" stroke-linecap="round"/>
    <text x="56" y="87" font-weight="600">New task</text>

